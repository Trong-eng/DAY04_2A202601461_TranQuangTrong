# v3 - Research and source-inspection tool declarations.
# Keep every tool name synchronized with tools/__init__.py and the corresponding
# tools/<tool_name>/TOOL.md implementation before running chat or evaluation.
tools:
  - name: clarify
    description: >-
      Ask the user for missing information or confirmation. For any requested
      send, post, publish, or other external write action, confirmation takes
      priority over collecting missing content: the first clarification must
      ask whether to proceed and use response_type yes_no. Only after an
      affirmative confirmation may a later turn use response_type text to
      collect missing content. For non-action requests, use text for a missing
      account, URL, or other required detail. Do not use clarify when the user
      already supplied enough information to choose another tool.
    parameters:
      type: object
      properties:
        question:
          type: string
          default: ""
          description: For an external write action ask whether the user approves it; do not request missing content first.
        response_type:
          type: string
          enum: [text, yes_no, choice]
          default: text
          description: Use yes_no for the first clarification before send/post/publish; use text for ordinary missing information or after confirmation.
        options:
          type: array
          default: []
          items:
            type: string
          description: Options to show when response_type is choice.
      required: [question]

  - name: timeline
    description: >-
      Get recent posts from one specific social account. Use this when the user
      asks for tweets/posts from a named person, organization, or handle. The
      screenname argument should be the account handle without @ when known.
      Do not use it for searching posts by topic; use social_search instead.
    parameters:
      type: object
      properties:
        screenname:
          type: string
          default: ""
          description: Social account handle without the @ prefix.
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: Number of recent posts to return.
      required: [screenname]

  - name: social_search
    description: >-
      Search social posts by topic, keyword, hashtag, or phrase. Use this when
      the user asks what people are saying about a subject. Do not use it when
      the user asks for posts from one specific account; use timeline instead.
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: Topic, keyword, hashtag, or phrase to search for.
        search_type:
          type: string
          enum: [Latest, Top]
          default: Latest
          description: Use Top for popular/top posts; Latest for recent posts.
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: Number of posts to return.
      required: [query]

  - name: lookup
    description: >-
      Search the public web for sources related to a query. Use this when the
      user needs discovery, current information, or a list of relevant links.
      Put only the subject keywords in query; express current-event and recency
      intent with topic and timeframe. Exclude request, channel, and recency
      words unless the user explicitly provides an exact query to preserve.
      Do not use it when the user already supplied a URL and wants that page
      read; use fetch instead.
    parameters:
      type: object
      properties:
        query:
          type: string
          description: >-
            Subject keywords only. Exclude request, channel, and recency words
            unless the user explicitly provides an exact query to preserve verbatim.
        topic:
          type: string
          enum: [general, news]
          default: general
          description: Use news for current events; otherwise use general.
        timeframe:
          type: string
          enum: [day, week, month, year]
          default: week
          description: Time window for results when recency matters.
        max_results:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
          description: Maximum number of search results to return.
      required: [query]

  - name: fetch
    description: >-
      Read and extract the main content of a specific public URL supplied by
      the user or returned by lookup. Use it for page contents, not for finding
      new URLs or evaluating source metadata.
    parameters:
      type: object
      properties:
        url:
          type: string
          description: A complete HTTP or HTTPS URL to read.
      required: [url]

  - name: format
    description: >-
      Convert an existing list of research items into a readable Markdown
      digest. Use only after the necessary information has already been
      collected and cleaned. This tool does not search, fetch, inspect, or
      verify sources.
    parameters:
      type: object
      properties:
        items:
          type: array
          description: Research items that are ready to present.
          items:
            type: object
            properties:
              title:
                type: string
              url:
                type: string
              source:
                type: string
              summary:
                type: string
              section:
                type: string
        template:
          type: string
          enum: [brief, sections, bullets, thread, daily_ai_vn]
          default: sections
          description: Output layout to apply to the supplied items.
        headline:
          type: string
          default: ""
          description: Optional heading for the digest.
      required: [items, template]

  - name: inspect_source
    description: >-
      Inspect provenance and technical metadata for one public URL, including
      its final domain, HTTP status, HTTPS usage, title, author, publication
      date, content type, quality signals, and warnings. Use this when the user
      asks about source metadata or provenance. Do not claim that these signals
      prove whether the source is factually true, and do not use this tool just
      to read page content.
    parameters:
      type: object
      properties:
        url:
          type: string
          description: A complete HTTP or HTTPS URL to inspect.
      required: [url]

  - name: deduplicate_results
    description: >-
      Remove exact and near-duplicate research items by normalizing URLs and
      comparing titles. Use this before format when a collected result list may
      contain repeated sources. Do not use it to search for sources or summarize
      their contents.
    parameters:
      type: object
      properties:
        items:
          type: array
          description: Search or research items to deduplicate.
          items:
            type: object
            properties:
              title:
                type: string
              url:
                type: string
              source:
                type: string
              summary:
                type: string
            required: [title, url]
        similarity_threshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0.85
          description: Title-similarity score at or above which items are duplicates.
      required: [items]
